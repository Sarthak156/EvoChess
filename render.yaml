services:
  - type: web
    name: adaptive-chess-api
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./adaptive_chess.db
      - key: CORS_ORIGINS
        value: '["https://evo-chess-fkuo.vercel.app"]'